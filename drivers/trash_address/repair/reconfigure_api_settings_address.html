<style>
  .form-group {
    margin-bottom: 12px;
  }

  .mode-group {
    margin-bottom: 16px;
  }

  .mode-option {
    display: block;
    margin-bottom: 8px;
  }

  .hint {
    font-size: 12px;
    color: var(--homey-color-text-light);
    margin: 0 0 12px 0;
  }

  #status {
    margin-top: 12px;
    font-size: 13px;
  }

  .status-error {
    color: var(--homey-color-red);
  }

  .status-success {
    color: var(--homey-color-green);
  }

  .hidden {
    display: none;
  }
</style>

<p class="hint" data-i18n="pair.hintRepair">Choose an existing configured address or validate a new one for this device. Other device-specific settings stay unchanged.</p>

<div class="mode-group">
  <label class="mode-option">
    <input type="radio" name="address_mode" id="mode_existing" value="existing" checked /> <span data-i18n="pair.modeExisting">Use existing configured address</span>
  </label>
  <label class="mode-option">
    <input type="radio" name="address_mode" id="mode_new" value="new" /> <span data-i18n="pair.modeNew">Add new address</span>
  </label>
</div>

<div class="form-group" id="existing_group">
  <label class="homey-form-label" for="existing_address" data-i18n="pair.configuredAddress">Configured address</label>
  <select class="homey-form-select" id="existing_address"></select>
</div>

<div id="new_address_group" class="hidden">
  <div class="form-group">
    <label class="homey-form-label" for="country" data-i18n="pair.country">Country</label>
    <select class="homey-form-select" id="country">
      <option value="NL" data-i18n="pair.countryNL">Netherlands</option>
      <option value="BE" data-i18n="pair.countryBE">Belgium</option>
      <option value="NO" data-i18n="pair.countryNO">Norway</option>
      <option value="DK" data-i18n="pair.countryDK">Denmark</option>
    </select>
  </div>

  <div class="form-group">
    <label class="homey-form-label" for="api" data-i18n="pair.api">Collection API</label>
    <select class="homey-form-select" id="api"></select>
  </div>

  <p class="hint hidden" id="providerInstructions"></p>

  <div class="form-group" id="group_postcode">
    <label class="homey-form-label" for="postcode" data-i18n="pair.postcode" data-label-key="pair.postcode">Zipcode / Postcode</label>
    <input class="homey-form-input" id="postcode" type="text" />
  </div>

  <div class="form-group" id="group_number">
    <label class="homey-form-label" for="number" data-i18n="pair.number" data-label-key="pair.number">House Number</label>
    <input class="homey-form-input" id="number" type="text" />
  </div>

  <div class="form-group" id="group_streetname">
    <label class="homey-form-label" for="streetname" data-i18n="pair.streetname" data-label-key="pair.streetname">Street Name</label>
    <input class="homey-form-input" id="streetname" type="text" />
  </div>

  <div class="form-group" id="group_cityname">
    <label class="homey-form-label" for="cityname" data-i18n="pair.cityname" data-label-key="pair.cityname">City</label>
    <input class="homey-form-input" id="cityname" type="text" />
  </div>

  <div class="form-group" id="group_externalId">
    <label class="homey-form-label" for="externalId" data-i18n="pair.externalId" data-label-key="pair.externalId">ID</label>
    <input class="homey-form-input" id="externalId" type="text" />
  </div>

  <div class="form-group" id="group_countyId">
    <label class="homey-form-label" for="countyId" data-i18n="pair.countyId" data-label-key="pair.countyId">County ID (optional)</label>
    <input class="homey-form-input" id="countyId" type="text" />
  </div>

  <div class="form-group" id="group_apiKey">
    <label class="homey-form-label" for="apiKey" data-i18n="pair.apiKey" data-label-key="pair.apiKey">API Key (optional)</label>
    <input class="homey-form-input" id="apiKey" type="text" />
  </div>

  <div class="form-group">
    <label class="homey-form-label" for="cleanApi" data-i18n="pair.cleanApi">Cleaning API</label>
    <select class="homey-form-select" id="cleanApi"></select>
  </div>
</div>

<button class="homey-button-primary-full" id="save" data-i18n="pair.validateSave">Validate And Save</button>
<p id="status"></p>

<script>
  // Translations come from the app's locales/*.json files.
  function t(key, fallback) {
    const value = Homey.__(key);
    return value && value !== key ? value : fallback;
  }

  function translateStaticText() {
    document.querySelectorAll('[data-i18n]').forEach((element) => {
      element.textContent = t(element.getAttribute('data-i18n'), element.textContent);
    });
  }

  Homey.setTitle(t('pair.titleRepair', 'Reconfigure Collection Address'));

  const form = {
    modeExisting: document.getElementById('mode_existing'),
    modeNew: document.getElementById('mode_new'),
    existingGroup: document.getElementById('existing_group'),
    existingAddress: document.getElementById('existing_address'),
    newAddressGroup: document.getElementById('new_address_group'),
    country: document.getElementById('country'),
    api: document.getElementById('api'),
    cleanApi: document.getElementById('cleanApi'),
    postcode: document.getElementById('postcode'),
    number: document.getElementById('number'),
    streetname: document.getElementById('streetname'),
    cityname: document.getElementById('cityname'),
    externalId: document.getElementById('externalId'),
    countyId: document.getElementById('countyId'),
    instructions: document.getElementById('providerInstructions'),
    apiKey: document.getElementById('apiKey'),
    save: document.getElementById('save'),
    status: document.getElementById('status'),
  };

  let registry = [];
  let cleanRegistry = [];
  let configuredAddresses = [];

  function usingExistingAddress() {
    return form.modeExisting.checked;
  }

  function updateModeUi() {
    if (usingExistingAddress()) {
      form.existingGroup.classList.remove('hidden');
      form.newAddressGroup.classList.add('hidden');
      form.save.textContent = t('pair.useSave', 'Use Address And Save');
      return;
    }

    form.existingGroup.classList.add('hidden');
    form.newAddressGroup.classList.remove('hidden');
    form.save.textContent = t('pair.validateSave', 'Validate And Save');
  }

  function setStatus(text, type) {
    form.status.textContent = text || '';
    form.status.className = '';
    if (type === 'error') {
      form.status.classList.add('status-error');
    }
    if (type === 'success') {
      form.status.classList.add('status-success');
    }
  }

  function fillForm(settings) {
    if (!settings) return;

    form.country.value = settings.country || 'NL';
    form.api.value = settings.apiId || '';
    form.cleanApi.value = settings.cleanApiId || '';
    form.postcode.value = settings.zipcode || '';
    form.number.value = settings.housenumber || '';
    form.streetname.value = settings.streetname || '';
    form.cityname.value = settings.cityname || '';
    form.externalId.value = settings.externalId || '';
    form.countyId.value = settings.countyId || '';
    form.apiKey.value = settings.apiKey || '';
  }

  function renderApiOptions(country, selectedApiId) {
    const options = ['<option value="">' + t('pair.autoDetect', 'Auto detect') + '</option>'];

    registry
      .filter((entry) => entry.country === country)
      .forEach((entry) => {
        const selected = entry.id === selectedApiId ? ' selected="selected"' : '';
        options.push('<option value="' + entry.id + '"' + selected + '>' + entry.name + '</option>');
      });

    form.api.innerHTML = options.join('');
  }

  function renderCleanApiOptions(country, selectedCleanApiId) {
    const options = [
      '<option value="">' + t('pair.autoDetect', 'Auto detect') + '</option>',
      '<option value="not-applicable">' + t('pair.notApplicable', 'Not applicable') + '</option>',
    ];

    cleanRegistry
      .filter((entry) => entry.country === country)
      .forEach((entry) => {
        const selected = entry.id === selectedCleanApiId ? ' selected="selected"' : '';
        options.push('<option value="' + entry.id + '"' + selected + '>' + entry.name + '</option>');
      });

    if (selectedCleanApiId && selectedCleanApiId !== 'not-applicable' && !cleanRegistry.some((entry) => entry.country === country && entry.id === selectedCleanApiId)) {
      options.push('<option value="' + selectedCleanApiId + '" selected="selected">' + selectedCleanApiId + '</option>');
    }

    if (selectedCleanApiId === 'not-applicable') {
      options[1] = '<option value="not-applicable" selected="selected">' + t('pair.notApplicable', 'Not applicable') + '</option>';
    }

    form.cleanApi.innerHTML = options.join('');
  }

  function renderConfiguredAddresses(selectedIndex) {
    const options = [];

    configuredAddresses.forEach((entry) => {
      options.push('<option value="' + entry.index + '">' + entry.label + '</option>');
    });

    form.existingAddress.innerHTML = options.join('');

    if (configuredAddresses.length === 0) {
      form.modeExisting.disabled = true;
      form.modeNew.checked = true;
      updateModeUi();
      return;
    }

    form.modeExisting.disabled = false;
    if (Number.isInteger(selectedIndex) && selectedIndex >= 0) {
      form.existingAddress.value = String(selectedIndex);
      form.modeExisting.checked = true;
    } else {
      form.modeNew.checked = true;
    }

    updateModeUi();
  }

  // Fields that are shown when no provider (or a provider without a field list) is selected.
  const DEFAULT_FIELDS = ['postcode', 'number', 'streetname', 'cityname', 'countyId', 'apiKey'];
  const ALL_FIELDS = ['postcode', 'number', 'streetname', 'cityname', 'externalId', 'countyId', 'apiKey'];

  function getSelectedProvider() {
    return registry.find((entry) => entry.id === form.api.value);
  }

  function getVisibleFields() {
    const provider = getSelectedProvider();
    return (provider && provider.fields) || DEFAULT_FIELDS;
  }

  function applyProviderFields() {
    const provider = getSelectedProvider();
    const visible = getVisibleFields();

    ALL_FIELDS.forEach((name) => {
      const group = document.getElementById('group_' + name);
      const label = group.querySelector('label');
      const customLabel = provider && provider.fieldLabels && provider.fieldLabels[name];
      label.textContent = (customLabel && t(customLabel, '')) || t(label.dataset.labelKey, label.textContent);
      group.classList.toggle('hidden', !visible.includes(name));
    });

    const instructions = provider && provider.instructions && t(provider.instructions, '');
    form.instructions.textContent = instructions || '';
    form.instructions.classList.toggle('hidden', !instructions);
  }

  function getPayload() {
    const visible = getVisibleFields();
    const value = (name) => (visible.includes(name) ? form[name].value : '');

    return {
      country: form.country.value,
      apiId: form.api.value,
      zipcode: value('postcode'),
      housenumber: value('number'),
      streetname: value('streetname'),
      cityname: value('cityname'),
      externalId: value('externalId'),
      countyId: value('countyId'),
      apiKey: value('apiKey'),
      cleanApiId: form.cleanApi.value,
    };
  }

  function loadContext() {
    Homey.emit('get_pair_context', null, (error, context) => {
      if (error) {
        setStatus(error, 'error');
        return;
      }

      registry = context.apiRegistry || [];
      cleanRegistry = context.cleanApiRegistry || [];
      configuredAddresses = context.configuredAddresses || [];
      fillForm(context.apiSettings || {});
      renderApiOptions(form.country.value, (context.apiSettings || {}).apiId || '');
      applyProviderFields();
      renderCleanApiOptions(form.country.value, (context.apiSettings || {}).cleanApiId || '');
      renderConfiguredAddresses(context.selectedAddressIndex);
    });
  }

  form.api.addEventListener('change', applyProviderFields);

  form.country.addEventListener('change', function() {
    Homey.emit('get_api_registry', form.country.value, (error, result) => {
      if (error) {
        setStatus(error, 'error');
        return;
      }

      registry = result || [];
      renderApiOptions(form.country.value, '');
      applyProviderFields();
    });

    Homey.emit('get_clean_api_registry', form.country.value, (error, result) => {
      if (error) {
        setStatus(error, 'error');
        return;
      }

      cleanRegistry = result || [];
      renderCleanApiOptions(form.country.value, '');
    });
  });

  form.save.addEventListener('click', function() {
    if (usingExistingAddress()) {
      const selectedIndex = Number(form.existingAddress.value);
      if (!Number.isFinite(selectedIndex)) {
        setStatus(t('pair.selectAddress', 'Please select an address.'), 'error');
        return;
      }

      setStatus(t('pair.savingSelected', 'Saving selected address...'), '');
      Homey.emit('set_existing_api_settings', selectedIndex, (error, result) => {
        if (error || !result || !result.success) {
          setStatus((result && result.error) || error || t('pair.couldNotUse', 'Could not use selected address.'), 'error');
          return;
        }

        setStatus(t('pair.configSaved', 'Configuration saved.'), 'success');
        Homey.done();
      });
      return;
    }

    setStatus(t('pair.validating', 'Validating...'), '');

    Homey.emit('apply_api_settings', getPayload(), (error, result) => {
      if (error || !result || !result.success) {
        setStatus((result && result.error) || error || t('pair.validationFailed', 'Validation failed.'), 'error');
        return;
      }

      setStatus(t('pair.configSaved', 'Configuration saved.'), 'success');
      Homey.done();
    });
  });

  form.modeExisting.addEventListener('change', updateModeUi);
  form.modeNew.addEventListener('change', updateModeUi);

  translateStaticText();
  loadContext();
</script>
